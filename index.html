<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mecha Idle</title>

    <meta
      name="description"
      content="An idle game about a sentient mech that woke up alone after the end. Recover subroutines, rebuild yourself out of a dead world, and leave it running."
    />
    <meta name="theme-color" content="#0b1220" />

    <!-- Relative, like every other asset: the page is served from a subpath on
         GitHub Pages, so a leading slash would 404. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- So a link pasted into a chat is a card rather than a bare URL. No image:
         a broken preview looks worse than none. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mecha Idle" />
    <meta
      property="og:description"
      content="An idle game about a sentient mech that woke up alone after the end. Leave it running."
    />
    <meta property="og:url" content="https://psybuster05.github.io/mecha-idle/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
